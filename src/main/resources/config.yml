# ============================================================================
#  BetterRTP configuration
#  Lightweight random teleportation for Paper/Purpur 26.2 (Java 25)
#  Text fields use MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  Use /rtp reload after editing. Invalid values fall back to safe defaults
#  and print a warning in the console.
# ============================================================================

# --- General ----------------------------------------------------------------
world: "world"

cooldown-time: 30
countdown-time: 5
cancel-on-move: true

# Global defaults
radius: 3000
shape: "SQUARE"
min-y: 64
max-y: 320

safe-location-attempts: 50
teleport-max-search-seconds: 20
preload-chunks: true

rtpgui-command-enabled: true
open-on-rtp: true
debug: false

# --- Worlds -----------------------------------------------------------------
worlds:
  world:
    enabled: true
    radius: 3000
    shape: "SQUARE"
    min-y: 64
    max-y: 320
    cooldown-time: 30
    center:
      x: 0
      z: 0
  world_nether:
    enabled: true
    radius: 3000
    shape: "SQUARE"
    min-y: 32
    max-y: 120
    cooldown-time: 30
  world_the_end:
    enabled: true
    radius: 3000
    shape: "SQUARE"
    min-y: 64
    max-y: 256
    cooldown-time: 30

# --- Cache ------------------------------------------------------------------
# Optional: pre-compute safe locations in the background when the server is idle.
# Speeds up /rtp at the cost of some CPU during quiet periods.
cache:
  enabled: true
  size: 100
  refill-interval-ticks: 100

# --- Biome RTP --------------------------------------------------------------
biome:
  enabled: true
  generate-chunks: true
  attempts-multiplier: 10

# --- Performance ------------------------------------------------------------
performance:
  max-global-searches: 3
  max-queue-size: 10
  chunk-load-timeout-ms: 5000
  max-candidates-per-second: 10
  # If true, RTP starts searching for a safe spot immediately during the countdown (slower speed).
  # When the countdown ends, it teleports instantly if found, or speeds up the search if still looking.
  search-during-countdown: true

# --- Safety -----------------------------------------------------------------
safety:
  reject-water: true
  reject-lava: true
  reject-fire: true
  reject-hazards: true
  reject-underground: true
  vertical-clearance: 2
  ignore-leaves: true
  max-scan-height: 8
  nether-enabled: true
  nether-minimum-open-height: 3

# --- Blacklist --------------------------------------------------------------
blacklist:
  - LAVA
  - WATER
  - FIRE
  - SOUL_FIRE
  - MAGMA_BLOCK
  - CACTUS
  - POWDER_SNOW
  - SWEET_BERRY_BUSH
  - WITHER_ROSE
  - COBWEB
  - POINTED_DRIPSTONE

# --- Sounds -----------------------------------------------------------------
teleport-sound:
  enabled: true
  name: "entity.enderman.teleport"
  volume: 1.0
  pitch: 1.0

countdown-sound:
  enabled: true
  name: "block.note_block.pling"
  volume: 1.0
  pitch: 1.0

# --- Particles --------------------------------------------------------------
countdown-particles:
  enabled: true
  name: "PORTAL"
  count: 10
  radius: 0.5
  spread: 0.5

teleport-particles:
  enabled: true
  name: "PORTAL"
  count: 50
  radius: 1.0
  spread: 1.0

# --- Display ----------------------------------------------------------------
display:
  actionbar: true
  title: true
  bossbar: false
  bossbar-color: "BLUE"
  bossbar-style: "SOLID"

# --- GUI --------------------------------------------------------------------
gui:
  title: "<dark_gray>RTP Destinations"
  filler-material: "GRAY_STAINED_GLASS_PANE"
  unavailable:
    slot: 22
    material: "BARRIER"
    name: "<red>Unavailable"
    lore:
      - "<gray>This destination is currently disabled or missing."

# --- Bedrock GUI (Forms) ----------------------------------------------------
bedrock-gui:
  enabled: true
  title: "RTP Destinations"
  content: "Choose a destination to teleport to:"

# --- Messages ---------------------------------------------------------------
# MiniMessage format: https://docs.advntr.dev/minimessage/format.html
messages:
  teleport-success: "<green>Teleported to <yellow><x>, <y>, <z></yellow> in <world>."
  teleport-failed: "<red>Teleport failed. Please try again."
  cooldown: "<red>You must wait <yellow><time></yellow> before using RTP again."
  no-permission: "<red>You do not have permission to use this command."
  already-in-progress: "<red>You already have an RTP request in progress."
  destination-unavailable: "<red>The <destination> destination is not available."
  invalid-world: "<red>World '<world>' does not exist."
  world-disabled: "<red>RTP is disabled in world '<world>'."
  biome-disabled: "<red>Biome RTP is currently disabled."
  busy: "<red>The server is too busy to process your RTP request right now. Please try again later."
  queued: "<yellow>All search slots are full. You have been placed in queue."
  searching: "<gray>Searching for a safe spot..."
  searching-early: "<gray>Searching for a safe spot while you wait..."
  searching-accelerated: "<yellow>Countdown finished! Accelerating search..."
  search-failed: "<red>Could not find a safe location in <world> within the time limit."
  world-unavailable: "<red>The world '<world>' is not available."
  cancelled-move: "<yellow>Teleport cancelled because you moved."
  cancelled-damage: "<yellow>Teleport cancelled because you took damage."
  cancelled-world: "<yellow>Teleport cancelled because you changed worlds."
  cancelled-world-unloaded: "<yellow>Teleport cancelled because the target world was unloaded."
  cancelled-reload: "<yellow>Teleport cancelled due to configuration reload."
  usage: "<usage>"
  reload-success: "<green>Configuration reloaded successfully."
  reload-failure: "<red>Failed to reload configuration. Check the console for errors."
  bedrock-unavailable: "<red>Bedrock GUI is not available right now."